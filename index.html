<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRUD Productos</title>
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex items-center justify-center">
  <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-3xl">
    <h1 class="text-3xl font-bold mb-6 text-center text-indigo-400">Gestión de Productos</h1>

    <!-- Formulario -->
    <form id="formProducto" class="space-y-4 mb-6">
      <input type="text" id="codigo" placeholder="Código" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-indigo-500">
      <input type="text" id="nombre" placeholder="Nombre" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-indigo-500">
      <input type="number" id="precio" placeholder="Precio" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-indigo-500">
      <input type="text" id="imagen" placeholder="URL Imagen" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:ring-2 focus:ring-indigo-500">
      <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700 transition">Agregar Producto</button>
    </form>

    <!-- Tabla -->
    <table class="w-full border-collapse">
      <thead class="bg-gray-700 text-indigo-300">
        <tr>
          <th class="p-2 text-left">Código</th>
          <th class="p-2 text-left">Nombre</th>
          <th class="p-2 text-left">Precio</th>
          <th class="p-2 text-left">Imagen</th>
          <th class="p-2 text-left">Acción</th>
        </tr>
      </thead>
      <tbody id="tablaProductos" class="bg-gray-800 text-gray-200"></tbody>
    </table>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
